name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le site (sans les fichiers de développement)
        run: |
          mkdir -p site
          rsync -a --exclude-from=.github/pages-exclude.txt ./ site/

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
