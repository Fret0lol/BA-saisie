<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche disconnecteur BA</title>
<meta name="theme-color" content="#0E5A73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiche BA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  --bg: #E9ECEA;        /* béton clair */
  --paper: #FFFFFF;
  --ink: #15232B;
  --muted: #5A6A72;
  --line: #CBD2D0;
  --petrol: #0E5A73;    /* action principale */
  --petrol-ink: #FFFFFF;
  --hex: #F2C230;       /* repères de section, comme les étiquettes de chantier */
  --hex-ink: #15232B;
  --ok: #1E7A46; --ok-bg: #E3F2E8;
  --ko: #B3261E; --ko-bg: #FBE7E5;
  --field: #F6F8F7;
  --pen: #12338C;
  --radius: 10px;
  --tap: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111A1E; --paper: #1A262B; --ink: #E7EEEC; --muted: #9AABB1; --line: #2F3E44;
    --petrol: #2E9CC0; --petrol-ink: #06222C; --hex: #F2C230; --hex-ink: #15232B;
    --ok: #5CC98A; --ok-bg: #173526; --ko: #F2877E; --ko-bg: #3A1D1B; --field: #223137;
    --pen: #12338C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(118px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Atkinson", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--hex); outline-offset: 2px; }

/* ---------- Barre du haut ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--paper);
  padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px 6px; max-width: 760px; margin: 0 auto; }
.brand { width: 34px; height: 30px; flex: none; }
.title { flex: 1; min-width: 0; }
.title h1 { font-size: 17px; margin: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title .sub { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.title .sub > * { flex: none; }
#ficheType { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
.saved { transition: opacity .3s; }
.offline { display: none; color: var(--ink); background: var(--hex); border-radius: 4px; padding: 0 6px; font-weight: 700; font-size: 12px; }
body.is-offline .offline { display: inline; }
.icon-btn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; font-size: 15px; }

nav.chips { display: flex; gap: 6px; overflow-x: auto; padding: 6px 16px 10px; max-width: 760px; margin: 0 auto; scrollbar-width: none; }
nav.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.chip.word { padding: 0 12px; }
.chip .hx { width: 26px; height: 24px; font-size: 13px; }
.chip.filled { border-color: var(--petrol); }
.chip.filled::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--petrol); }
.chip.current { box-shadow: 0 0 0 2px var(--petrol) inset; font-weight: 700; }
.chip:disabled { opacity: .4; }
#stepCounter { color: var(--muted); }

/* Hexagone de section : reprend le repère « BA » de la fiche papier */
.hx { display: inline-grid; place-items: center; background: var(--hex); color: var(--hex-ink); font-weight: 700;
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); flex: none; }

/* ---------- Contenu ---------- */
main { max-width: 760px; margin: 0 auto; padding: 16px 12px 24px; }
section.card { background: var(--paper); border-radius: var(--radius); padding: 18px 16px 20px; margin-bottom: 14px; border: 1px solid var(--line); }
section.card[hidden] { display: none; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.card-head .hx { width: 44px; height: 38px; font-size: 20px; }
.card-head .tag { font-size: 13px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--muted); border-radius: 6px; padding: 2px 7px; }
.card-head h2 { font-size: 20px; line-height: 1.2; margin: 0; }
.card-intro { color: var(--muted); font-size: 14px; margin: 6px 0 4px; }

.field { margin-top: 16px; }
.field[hidden] { display: none; }
.field > label, .field > .lab { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.req { color: var(--ko); }
input.invalid, textarea.invalid { border-color: var(--ko); }
.seg.invalid { outline: 2px solid var(--ko); outline-offset: 3px; border-radius: 8px; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], input[inputmode], textarea {
  width: 100%; min-height: var(--tap); padding: 10px 12px; font-size: 17px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--field);
}
input[type=date] { appearance: none; -webkit-appearance: none; display: block; }
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--petrol); outline: none; background: var(--paper); }
.prefix { display: flex; align-items: stretch; }
.prefix span { white-space: nowrap; display: grid; place-items: center; padding: 0 10px; border: 1.5px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; color: var(--muted); font-weight: 700; background: var(--bg); }
.prefix input { border-radius: 0 8px 8px 0; }

/* Choix segmentés */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { flex: 1 1 auto; min-height: var(--tap); padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); font-size: 16px; }
.seg button[aria-checked=true] { background: var(--petrol); border-color: var(--petrol); color: var(--petrol-ink); font-weight: 700; }
.seg.stack { flex-direction: column; }
.seg.stack button { text-align: left; display: flex; gap: 10px; align-items: center; }
.seg.stack button::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; flex: none; opacity: .6; }
.seg.stack button[aria-checked=true]::before { background: currentColor; box-shadow: inset 0 0 0 3px var(--paper); opacity: 1; }
.seg.stack button.good[aria-checked=true] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.seg.stack button.bad[aria-checked=true] { background: var(--ko-bg); border-color: var(--ko); color: var(--ko); }

.check { display: flex; gap: 12px; align-items: center; min-height: var(--tap); padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 8px; margin-top: 8px; }
.check input { width: 24px; height: 24px; accent-color: var(--petrol); flex: none; }
.check:has(input:checked) { border-color: var(--petrol); }

.btn { min-height: var(--tap); padding: 0 18px; border-radius: 8px; border: 1.5px solid var(--petrol); background: var(--paper); color: var(--petrol); font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--petrol); color: var(--petrol-ink); }
.btn.danger { border-color: var(--ko); color: var(--ko); }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 12px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* Essais */
.essai { border-top: 1px solid var(--line); padding: 18px 0 4px; }
.essai:first-of-type { border-top: 0; }
.essai-head { display: flex; gap: 12px; align-items: flex-start; }
.essai-n { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 700; flex: none; }
.essai-g { font-weight: 700; font-size: 17px; }
.essai-m { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.press { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.press .prefix span { min-width: 58px; }
.timer { margin-top: 10px; }
.timer.run { background: var(--hex); border-color: var(--hex); color: var(--hex-ink); }
.essai details { margin-top: 12px; }
.essai summary { cursor: pointer; color: var(--petrol); font-weight: 700; min-height: 40px; display: flex; align-items: center; }
.alert { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--ko); background: var(--ko-bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.alert[hidden] { display: none; }
.note-star { font-size: 14px; color: var(--muted); margin-top: 6px; }

/* Récapitulatif */
.recap-card .card-head h2 { flex: 1; }
.recap-list { margin: 10px 0 0; }
.recap-list dt { font-weight: 700; font-size: 13px; color: var(--muted); margin-top: 8px; }
.recap-list dt:first-child { margin-top: 0; }
.recap-list dd { margin: 0 0 0; font-size: 15px; }

/* Pièces */
.piece { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.piece .full { grid-column: 1 / -1; }
.piece[hidden] { display: none; }

/* Signature */
.sig { position: relative; border: 1.5px dashed var(--muted); border-radius: 8px; background: #fff; height: 170px; touch-action: none; }
.sig canvas { width: 100%; height: 100%; display: block; border-radius: 8px; }
.sig .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #8A979C; pointer-events: none; font-size: 15px; }
.sig.has .ph { display: none; }
.sig-actions { display: flex; justify-content: flex-end; margin-top: 6px; }

/* Barre d'action */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bottom-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.bottom .btn.primary { flex: 1; font-size: 17px; min-height: 52px; }

/* Feuilles modales */
dialog { border: 0; padding: 0; width: min(560px, 100%); max-height: 88vh; margin: auto auto 0; border-radius: 16px 16px 0 0; background: var(--paper); color: var(--ink); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 16px; } }
dialog::backdrop { background: rgba(10, 20, 25, .55); }
.sheet { padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 0 0 4px; font-size: 20px; }
.sheet p { margin: 6px 0; color: var(--muted); }
.sheet .stack { display: grid; gap: 10px; margin-top: 16px; }
.sheet .btn { width: 100%; }
.warn { color: var(--ko); background: var(--ko-bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
.fname { font-weight: 700; color: var(--ink) !important; word-break: break-all; }
.fiche-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
.fiche-item.current { border-color: var(--petrol); border-width: 2px; }
.fiche-item b { display: block; }
.fiche-item small { color: var(--muted); }
.fiche-list { max-height: 55vh; overflow-y: auto; }
.toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <svg class="brand" viewBox="0 0 34 30" aria-hidden="true"><polygon points="8.5,1 25.5,1 33,15 25.5,29 8.5,29 1,15" fill="var(--hex)" stroke="var(--ink)" stroke-width="1.5"/><text x="17" y="19.5" text-anchor="middle" font-size="12" font-weight="700" fill="#15232B" font-family="Atkinson, sans-serif">BA</text></svg>
    <div class="title">
      <h1 id="ficheTitle">Nouvelle fiche</h1>
      <div class="sub"><span id="ficheType">Type à choisir</span><span id="stepCounter"></span><span class="offline">Hors ligne</span><span class="saved" id="saved"></span></div>
    </div>
    <button class="icon-btn" id="btnFiches" type="button">Mes fiches</button>
  </div>
  <nav class="chips" id="chips" aria-label="Étapes"></nav>
</header>

<main id="form"></main>

<div class="bottom"><div class="bottom-in" id="bottomBar"></div></div>

<dialog id="dlgPdf"><div class="sheet">
  <h3 id="pdfTitle">PDF prêt</h3>
  <p class="fname" id="pdfName"></p>
  <div id="pdfWarn"></div>
  <div class="stack">
    <button class="btn primary" id="btnShare" type="button">Partager ou envoyer par mail</button>
    <button class="btn" id="btnSave" type="button">Enregistrer sur l’appareil</button>
    <button class="btn" id="btnOpen" type="button">Ouvrir le PDF</button>
    <button class="btn small" id="btnClosePdf" type="button">Revenir à la saisie</button>
  </div>
</div></dialog>

<dialog id="dlgFiches"><div class="sheet">
  <h3>Mes fiches</h3>
  <p>Enregistrées sur ce téléphone, disponibles hors ligne.</p>
  <div class="stack">
    <button class="btn primary" id="btnNew" type="button">Nouvelle fiche</button>
    <button class="btn" id="btnProfile" type="button">Mes informations (vérificateur)</button>
  </div>
  <div class="fiche-list" id="ficheList"></div>
  <div class="stack"><button class="btn small" id="btnCloseFiches" type="button">Fermer</button></div>
</div></dialog>

<dialog id="dlgProfile"><div class="sheet">
  <h3>Mes informations</h3>
  <p>Préremplies automatiquement sur les prochaines fiches (vérificateur, entreprise, appareillage de contrôle).</p>
  <div id="profileForm"></div>
  <div class="stack">
    <button class="btn primary" id="btnSaveProfile" type="button">Enregistrer</button>
    <button class="btn small" id="btnCloseProfile" type="button">Fermer sans enregistrer</button>
  </div>
</div></dialog>

<div class="toast" id="toast" role="status"></div>

<script src="pdf-lib.min.js"></script>
<script src="fill.js"></script>
<script>
'use strict';
/* =====================================================================
   Définition du formulaire
   ===================================================================== */
const YN = [['oui', 'Oui'], ['non', 'Non']];
const T = (k, label, o = {}) => ({ t: 'text', k, label, ...o });
const SEG = (k, label, opts, o = {}) => ({ t: 'seg', k, label, opts, ...o });
const CHK = (k, label, o = {}) => ({ t: 'check', k, label, ...o });
const eq = (k, v) => (d) => d[k] === v;

const TYPES = { mes: 'Avis de mise en service', maint: 'Fiche de maintenance', dep: 'Fiche de dépannage' };
// Sections à renseigner selon le type (d'après l'en-tête de la fiche)
const SHOW = {
  mes: null, // toutes
  maint: (id) => !['s5', 'mesAno'].includes(id),
  dep: (id) => ['type', 's1', 's2', 's3', 's9', 'essais', 'app', 'pieces', 'sign'].includes(id),
};

const SECTIONS = [
  { id: 'type', chip: 'Type', title: 'Type de fiche', fields: [
    SEG('typeFiche', 'Cette fiche est un…', [['mes', 'Avis de mise en service'], ['maint', 'Maintenance'], ['dep', 'Dépannage']], { stack: 1, required: 1 }),
    SEG('carnet', 'Fichier ou carnet sanitaire présenté', YN, { required: 1 }),
  ] },
  { id: 's1', num: 1, title: 'Installation et propriétaire', fields: [
    T('adressePose', 'Adresse de pose', { required: 1 }),
    T('proprio', 'Propriétaire de l’installation', { required: 1 }),
    { t: 'row', fields: [T('proprioTel', 'Téléphone', { type: 'tel', required: 1 }), T('proprioMail', 'Mail', { type: 'email', required: 1 })] },
    T('proprioAdresse', 'Adresse du propriétaire', { required: 1 }),
  ] },
  { id: 's2', num: 2, title: 'Vérificateur', autoSkip: 1, fields: [
    T('verificateur', 'Vérificateur', { required: 1 }),
    T('competences', 'Compétences reconnues par', { required: 1 }),
    { t: 'row', fields: [T('certificat', 'N° de certificat', { required: 1 }), T('certifExpiration', 'Date d’expiration', { type: 'date', required: 1 })] },
    T('entreprise', 'Entreprise', { required: 1 }),
    { t: 'row', fields: [T('entrepriseTel', 'Téléphone', { type: 'tel', required: 1 }), T('entrepriseMail', 'Mail', { type: 'email', required: 1 })] },
    T('entrepriseAdresse', 'Adresse de l’entreprise', { required: 1 }),
    { t: 'action', label: 'Réutiliser mes infos pour les prochaines fiches', act: 'saveProfile', hint: 'Vérificateur, entreprise et appareillage de contrôle seront préremplis.' },
  ] },
  { id: 's3', num: 3, title: 'Identification du disconnecteur', fields: [
    { t: 'row', fields: [T('marque', 'Marque'), T('typeDisc', 'Type')] },
    { t: 'row', fields: [T('diametre', 'Diamètre'), T('serie', 'N° de série')] },
    T('norme', 'Référence à la norme', { prefix: 'NF EN' }),
    SEG('logoNF', 'Logo NF', YN),
  ] },
  { id: 's4', num: 4, title: 'Installation', fields: [
    T('reseauProtege', 'Protège du retour d’un réseau de'),
    T('lieuPose', 'Lieu de pose'),
    SEG('traitement', 'Système de traitement d’eau', YN),
    SEG('traitementPos', 'Situé', [['amont', 'En amont'], ['aval', 'En aval']], { when: eq('traitement', 'oui') }),
    T('traitementLequel', 'Lequel', { when: eq('traitement', 'oui') }),
    T('hauteur', 'Hauteur du point le plus élevé en aval', { hint: 'par ex. 12 m' }),
    T('communication', 'Communication avec un réseau complémentaire', { hint: 'eau de pluie, eau industrielle…' }),
  ] },
  { id: 's5', num: 5, title: 'Mise en service', intro: 'Remplir aussi le cadre « Lors de la mise en service » plus bas.', fields: [
    SEG('installType', 'Installation', [['neuve', 'Neuve'], ['renovation', 'Rénovation']]),
    T('installateur', 'Installateur'),
    { t: 'row', fields: [T('installateurTel', 'Téléphone', { type: 'tel' }), T('installateurMail', 'Mail', { type: 'email' })] },
    T('installateurAdresse', 'Adresse de l’installateur'),
    SEG('avis', 'Choix du dispositif de protection (EN 1717)', [['adapte', 'Adapté'], ['nonAdapte', 'Non adapté'], ['reserve', 'Avis réservé']]),
    T('avisMotif', 'Motif', { when: (d) => d.avis === 'nonAdapte' || d.avis === 'reserve' }),
    CHK('infoResponsable', 'Responsable du réseau informé de l’obligation de maintenance'),
  ] },
  { id: 's6', num: 6, title: 'Conformité du local', intro: 'Selon EN 1717 : aération, accès, évacuation d’eau…', fields: [
    SEG('localConforme', 'Local conforme', YN),
    T('localMotif', 'Motif', { when: eq('localConforme', 'non') }),
    SEG('immersion', 'Risque d’immersion', YN),
    T('evacuation', 'Mode d’évacuation des eaux du local'),
  ] },
  { id: 's7', num: 7, title: 'Conformité aux règles de pose', intro: 'Rupture de charge à 0,50 m mini du sol, disconnecteur entre 0,50 et 1,50 m, dégagements X1 et X2 suffisants pour la maintenance.', fields: [
    SEG('poseConforme', 'Pose conforme', YN),
    { t: 'area', k: 'poseMotif', label: 'Motif', when: eq('poseConforme', 'non') },
    SEG('bipasse', 'Présence d’un bipasse', YN),
    T('bipasseObs', 'Observations sur le bipasse', { when: eq('bipasse', 'oui') }),
  ] },
  { id: 's8', num: 8, title: 'Risque sanitaire avéré', fields: [
    SEG('risque', 'Risque sanitaire avéré', YN),
    { t: 'label', label: 'Origine', when: eq('risque', 'oui') },
    CHK('origChoix', 'Choix non adapté (avis de mise en service)', { when: eq('risque', 'oui') }),
    CHK('origPose', 'Pose non conforme', { when: eq('risque', 'oui') }),
    CHK('origFonct', 'Fonctionnement non conforme', { when: eq('risque', 'oui') }),
    CHK('origLocal', 'Local non conforme', { when: eq('risque', 'oui') }),
    T('risqueObs', 'Observations'),
  ] },
  { id: 's9', num: 9, title: 'Tests : constats avant manœuvre', intro: 'Prendre toutes les précautions avant de procéder aux tests.', fields: [
    SEG('decharge', 'Décharge', [['sans', 'Sans fuite'], ['goutte', 'Goutte à goutte'], ['legere', 'Fuite légère'], ['importante', 'Fuite importante']]),
    T('autresFuites', 'Autres fuites', { hint: 'couvercle, raccords…' }),

function sigField(f) {
  const wrap = h('div', { class: 'sig' });
  const canvas = h('canvas');
  wrap.append(canvas, h('div', { class: 'ph' }, 'Signez ici avec le doigt'));
  let ctx, drawing = false, dirty = false, last;
  const setup = () => {
    const r = wrap.getBoundingClientRect(); if (!r.width) return;
    const dpr = Math.max(window.devicePixelRatio || 1, 2);
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
    ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.6; ctx.strokeStyle = '#12338C';
    if (D()[f.k]) { const img = new Image(); img.onload = () => { const s = Math.min(r.width / img.width, r.height / img.height, 1) * 0.95; const w = img.width * s, hh = img.height * s; ctx.drawImage(img, (r.width - w) / 2, (r.height - hh) / 2, w, hh); }; img.src = D()[f.k]; wrap.classList.add('has'); }
  };
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener('pointerdown', (e) => { if (!ctx) setup(); drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.2, 0, 7); ctx.fillStyle = '#12338C'; ctx.fill(); wrap.classList.add('has'); dirty = true; });
  canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; });
  const end = () => { if (!drawing) return; drawing = false; if (dirty) setVal(f.k, trimCanvas(canvas)); };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  const clear = () => { if (!ctx) setup(); ctx.clearRect(0, 0, canvas.width, canvas.height); wrap.classList.remove('has'); dirty = false; setVal(f.k, ''); };
  sigSetups.push(setup);
  return h('div', { class: 'field' }, h('div', { class: 'lab' }, f.label, f.hint ? h('span', { class: 'hint' }, ' (' + f.hint + ')') : null), wrap,
    h('div', { class: 'sig-actions' }, h('button', { type: 'button', class: 'btn small', onclick: clear }, 'Effacer')));
}
let sigSetups = [];
// Recadre la signature sur le tracé pour qu'elle occupe bien la case du PDF
function trimCanvas(c) {
  const ctx = c.getContext('2d'); const { width: w, height: hh } = c;
  const px = ctx.getImageData(0, 0, w, hh).data;
  let x0 = w, y0 = hh, x1 = -1, y1 = -1;
  for (let y = 0; y < hh; y += 2) for (let x = 0; x < w; x += 2) if (px[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return '';
  const pad = 8; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w, x1 + pad); y1 = Math.min(hh, y1 + pad);
  const out = document.createElement('canvas'); const scale = Math.min(1, 600 / (x1 - x0));
  out.width = (x1 - x0) * scale; out.height = (y1 - y0) * scale;
  out.getContext('2d').drawImage(c, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

let timer = null;
function timerButton() {
  const b = h('button', { type: 'button', class: 'btn small timer', onclick: () => startTimer(b) }, 'Minuteur 3 min');
  return b;
}
function startTimer(btn) {
  if (timer) { clearInterval(timer.iv); timer.btn.classList.remove('run'); timer.btn.textContent = 'Minuteur 3 min'; if (timer.btn === btn) { timer = null; return; } }
  let left = 180; btn.classList.add('run');
  const tick = () => { btn.textContent = `Relever dans ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} (toucher pour arrêter)`; };
  tick();
  timer = { btn, iv: setInterval(() => {
    left--; tick();
    if (left <= 0) {
      clearInterval(timer.iv); timer = null; btn.classList.remove('run'); btn.textContent = 'Relever la pression maintenant';
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
      beep();
    }
  }, 1000) };
}
function beep() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .35].forEach((t) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.2, ac.currentTime + t); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .2); }); } catch {}
}

function sectionVisible(id, d = D()) { const t = d.typeFiche; return !t || !SHOW[t] || SHOW[t](id); }

/* ---------- Parcours pas-à-pas ----------
   Un « step » est soit une section normale, soit un essai isolé (§ Essais),
   soit l'écran de récapitulatif final. On ne peut avancer que dans l'ordre ;
   une étape déjà franchie (Suivant cliqué) reste accessible en arrière. */
let steps = [];
let stepIndex = 0;

function computeSteps() {
  const out = [];
  for (const s of SECTIONS) {
    if (!sectionVisible(s.id)) continue;
    if (s.id === 'essais') { for (const e of ESSAIS) out.push({ id: `essai-${e.n}`, parent: 'essais', section: s, essai: e }); }
    else out.push({ id: s.id, section: s });
  }
  out.push({ id: 'recap', recap: true });
  return out;
}
function stepUnlocked(idx) {
  if (idx <= 0) return true;
  const prevId = steps[idx - 1].id;
  return !!(D()._visited && D()._visited[prevId]);
}
function enterFiche() {
  steps = computeSteps();
  const idx = steps.findIndex((s) => s.id === D()._step);
  stepIndex = idx === -1 ? 0 : idx;
  renderStep();
}
// Champs obligatoires : bloquent le passage à l'étape suivante (pas de saisie forcée en arrière)
function collectRequiredFields(fields) {
  let out = [];
  for (const f of fields) {
    if (f.t === 'row') { out = out.concat(collectRequiredFields(f.fields)); continue; }
    if (f.required && f.k) out.push(f);
  }
  return out;
}
function stepMissingFields(step) {
  if (!step.section) return [];
  const d = D();
  return collectRequiredFields(step.section.fields).filter((f) => {
    if (f.when && !f.when(d)) return false;
    const v = d[f.k];
    return v == null || v === '';
  });
}
function markMissing(fields) {
  const main = $('#form');
  let first = null;
  for (const f of fields) {
    const el = main.querySelector(`[name="${f.k}"]`) || main.querySelector(`.seg[data-k="${f.k}"]`);
    if (el) { el.classList.add('invalid'); if (!first) first = el; }
  }
  if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (first.focus) first.focus(); }
}
// Étape déjà entièrement préremplie (ex. profil vérificateur) : on la saute en avançant
function autoSkipForward() {
  while (stepIndex < steps.length - 1) {
    const step = steps[stepIndex];
    if (!step.section || !step.section.autoSkip || stepMissingFields(step).length) break;
    (D()._visited || (D()._visited = {}))[step.id] = true;
    stepIndex++;
  }
}
function goNext() {
  const step = steps[stepIndex];
  if (!step) return;
  const missing = stepMissingFields(step);
  if (missing.length) { markMissing(missing); toast('À compléter : ' + missing.map((f) => f.label).join(', ')); return; }
  const visited = D()._visited || (D()._visited = {});
  visited[step.id] = true;
  if (stepIndex < steps.length - 1) stepIndex++;
  autoSkipForward();
  scheduleSave();
  renderStep();
}
function goPrev() {
  if (stepIndex > 0) stepIndex--;
  renderStep();
}
function goToStep(id) {
  steps = computeSteps();
  const idx = steps.findIndex((s) => s.id === id);
  if (idx === -1) return;
  if (!stepUnlocked(idx)) { toast('Terminez d’abord les étapes précédentes.'); return; }
  stepIndex = idx;
  renderStep();
}

function renderSectionCard(s) {
  const head = h('div', { class: 'card-head' },
    s.num ? h('span', { class: 'hx', 'aria-hidden': 'true' }, String(s.num)) : null,
    h('h2', {}, s.title),
    s.tag ? h('span', { class: 'tag' }, s.tag) : null);
  return h('section', { class: 'card', 'aria-label': s.title }, head, s.intro ? h('p', { class: 'card-intro' }, s.intro) : null, s.fields.map(renderField));
}
function renderEssaiStep(step) {
  const s = step.section, e = step.essai;
  const head = h('div', { class: 'card-head' }, h('h2', {}, s.title), h('span', { class: 'tag' }, s.tag || 'Verso'));
  const sub = h('p', { class: 'card-intro' }, `Essai ${e.n} sur ${ESSAIS.length}` + (e.n === 1 && s.intro ? ' — ' + s.intro : ''));
  const card = h('section', { class: 'card', 'aria-label': s.title + ' — essai ' + e.n }, head, sub, essaiCard(e));
  if (e.n === 12) {
    const al = h('div', { class: 'alert' }, 'Un ou plusieurs Δp sont mauvais : reprendre les essais 5, 6 et 7. Si les mêmes anomalies persistent, envisager dans les meilleurs délais le remplacement du disconnecteur. Ne pas mettre de bipasse sans protection équivalente.');
    conditional.push([al, (d) => ['e10', 'e11', 'e12'].some((k) => d[k] === 'ko')]);
    card.append(al);
  }
  return card;
}
function fieldValueLabel(f, v) {
  if (f.t === 'seg') { const o = f.opts.find(([val]) => val === v); return o ? o[1] : v; }
  if (f.t === 'check') return v ? 'Oui' : null;
  return v;
}
function renderRecap() {
  const wrap = h('div', { class: 'recap' });
  wrap.append(h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h2', {}, 'Récapitulatif')),
    h('p', { class: 'card-intro' }, 'Vérifiez les informations avant de générer le PDF. Touchez « Modifier » pour corriger une section.')));
  const d = D();
  for (const s of SECTIONS) {
    if (s.id === 'type' || !sectionVisible(s.id)) continue;
    const rows = [];
    if (s.id === 'essais') {
      for (const e of ESSAIS) {
        const v = d[`e${e.n}`]; if (!v) continue;
        const opt = e.opts && e.opts.find(([val]) => val === v);
        rows.push([`Essai ${e.n} — ${e.g}`, opt ? opt[1] : v]);
      }
    } else if (s.id === 'pieces') {
      for (let i = 1; i <= 5; i++) if (d[`piece${i}`]) rows.push([`Pièce ${i}`, [d[`piece${i}`], d[`piece${i}_n`] ? `(manœuvre ${d[`piece${i}_n`]})` : '', d[`piece${i}_obs`]].filter(Boolean).join(' ')]);
    } else if (s.id === 'sign') {
      rows.push(['Signature du vérificateur', d.sigVerif ? 'Signée' : 'Manquante']);
      rows.push(['Signature du responsable', d.sigResp ? 'Signée' : 'Manquante']);
      if (d.verifNom) rows.push(['Vérificateur', d.verifNom]);
      if (d.respNom) rows.push(['Responsable', d.respNom]);
    } else {
      for (const k of keysOf(s, true)) {
        const f = FIELD_META[k]; if (!f) continue;
        const v = d[k]; if (v == null || v === '') continue;
        const lab = fieldValueLabel(f, v); if (lab == null) continue;
        rows.push([f.label, lab]);
      }
    }
    const stepId = s.id === 'essais' ? 'essai-1' : s.id;
    wrap.append(h('section', { class: 'card recap-card' },
      h('div', { class: 'card-head' }, s.num ? h('span', { class: 'hx' }, String(s.num)) : null, h('h2', {}, s.title),
        h('button', { type: 'button', class: 'btn small', onclick: () => goToStep(stepId) }, 'Modifier')),
      rows.length ? h('dl', { class: 'recap-list' }, rows.flatMap(([l, v]) => [h('dt', {}, l), h('dd', {}, v)])) : h('p', { class: 'card-intro' }, 'Rien de renseigné.')));
  }
  return wrap;
}
function renderChips() {
  steps = computeSteps();
  const chips = $('#chips'); chips.innerHTML = '';
  const d = D();
  const addChip = (firstId, node) => {
    const idx = steps.findIndex((s) => s.id === firstId);
    if (idx === -1) return;
    const unlocked = stepUnlocked(idx);
    const isCurrent = steps[stepIndex] && (steps[stepIndex].id === firstId || (firstId === 'essai-1' && steps[stepIndex].parent === 'essais'));
    node.classList.toggle('current', !!isCurrent);
    if (!unlocked) node.disabled = true;
    node.addEventListener('click', () => goToStep(firstId));
    chips.append(node);
  };
  for (const s of SECTIONS) {
    if (!sectionVisible(s.id)) continue;
    const firstId = s.id === 'essais' ? 'essai-1' : s.id;
    const keys = s.id === 'essais' ? ESSAIS.map((e) => `e${e.n}`) : s.id === 'pieces' ? [1, 2, 3, 4, 5].map((i) => `piece${i}`) : keysOf(s);
    const filled = keys.some((k) => d[k] != null && d[k] !== '');
    const chip = h('button', { type: 'button', class: 'chip' + (s.num ? '' : ' word') + (filled ? ' filled' : '') },
      s.num ? h('span', { class: 'hx' }, String(s.num)) : null, s.num ? shortTitle(s) : s.chip);
    addChip(firstId, chip);
  }
  addChip('recap', h('button', { type: 'button', class: 'chip word' }, 'Récap'));
  if (steps[stepIndex]) $('#stepCounter').textContent = `Étape ${stepIndex + 1} / ${steps.length}`;
  const cur = chips.querySelector('.chip.current');
  if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function renderBottomBar(step) {
  const bar = $('#bottomBar'); bar.innerHTML = '';
  if (stepIndex > 0) bar.append(h('button', { class: 'btn', type: 'button', onclick: goPrev }, 'Précédent'));
  if (!step.recap) bar.append(h('button', { class: 'btn', type: 'button', 'aria-label': 'Aperçu du PDF rempli', onclick: (e) => generate(e.currentTarget) }, 'Aperçu'));
  bar.append(step.recap
    ? h('button', { class: 'btn primary', type: 'button', onclick: (e) => generate(e.currentTarget) }, 'Générer le PDF')
    : h('button', { class: 'btn primary', type: 'button', onclick: goNext }, 'Suivant'));
}
function renderStep() {
  conditional.length = 0; sigSetups = []; idc = 0;
  steps = computeSteps();
  if (stepIndex >= steps.length) stepIndex = steps.length - 1;
  if (stepIndex < 0) stepIndex = 0;
  const step = steps[stepIndex];
  D()._step = step.id;
  const main = $('#form'); main.innerHTML = '';
  if (step.recap) main.append(renderRecap());
  else if (step.parent === 'essais') main.append(renderEssaiStep(step));
  else main.append(renderSectionCard(step.section));
  renderBottomBar(step);
  afterChange();
  requestAnimationFrame(() => sigSetups.forEach((f) => f()));
  window.scrollTo(0, 0);
}

function afterChange(k) {
  const d = D();
  for (const [el, when] of conditional) el.hidden = !when(d);
  if (k === 'typeFiche' || k === 'adressePose' || k === 'verifDate' || k == null) updateTitle();
  renderChips();
}
// Nom d'une fiche : adresse de pose + date (celle du vérificateur une fois connue, sinon la date du jour)
const frDate = (v) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); return m ? `${m[3]}/${m[2]}/${m[1]}` : v; };
function ficheName(d) { return d.adressePose ? `${d.adressePose} — ${frDate(d.verifDate || today())}` : 'Nouvelle fiche'; }
function updateTitle() {
  $('#ficheTitle').textContent = ficheName(D());
  $('#ficheType').textContent = TYPES[D().typeFiche] || 'Type à choisir';
}

// Liste des clés d'une section (pour l'export et les indicateurs)
function keysOf(s, onlyVisible = false, d = D()) {
  const out = [];
  const walk = (f) => {
    if (onlyVisible && f.when && !f.when(d)) return;
    if (f.t === 'row') return f.fields.forEach(walk);
    if (f.k) out.push(f.k);
    if (f.t === 'essais') for (const e of ESSAIS) {
      e.p.forEach(([sfx]) => out.push(`e${e.n}_${sfx}`, `r${e.n}_${sfx}`));
      if (e.opts) out.push(`e${e.n}`);
      (e.notes || []).forEach(([k, , cond]) => { if (!onlyVisible || cond(d[`e${e.n}`])) out.push(k); });
      if (e.final) out.push('v1Final', 'v2Final');
    }
    if (f.t === 'pieces') for (let i = 1; i <= 5; i++) out.push(`piece${i}`, `piece${i}_n`, `piece${i}_obs`);
  };
  s.fields.forEach(walk);
  return out;
}
function exportData(d = D()) {
  const out = {};
  for (const s of SECTIONS) {
    if (!sectionVisible(s.id, d)) continue;
    for (const k of keysOf(s, true, d)) if (d[k] != null && d[k] !== '') out[k] = d[k];
  }
  return out;
}

/* =====================================================================
   Actions
   ===================================================================== */
const actions = {
  saveProfile() {
    const p = {}; PROFILE_KEYS.forEach((k) => { if (D()[k]) p[k] = D()[k]; });
    if (!p.verifNom && D().verificateur) p.verifNom = D().verificateur;
    store.set('ba.profile', p); toast('Vos infos seront préremplies sur les prochaines fiches.');
  },
};

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- Mes informations (profil vérificateur), modifiable sans ouvrir de fiche ---------- */
let profileDraft = {};
function profileField(f) {
  if (f.t === 'seg') {
    const group = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': f.label });
    group.append(...f.opts.map(([v, lab]) => {
      const b = h('button', { type: 'button', role: 'radio', 'aria-checked': String(profileDraft[f.k] === v),
        onclick: () => { profileDraft[f.k] = profileDraft[f.k] === v ? '' : v; renderProfileForm(); } }, lab);
      b.dataset.v = v; return b;
    }));
    return h('div', { class: 'field' }, h('div', { class: 'lab' }, f.label), group);
  }
  const id = 'pf-' + f.k;
  const input = h('input', { id, type: f.type === 'date' ? 'date' : (f.type || 'text'), value: profileDraft[f.k] ?? '', autocomplete: 'off',
    oninput: (e) => { profileDraft[f.k] = e.target.value; } });
  return h('div', { class: 'field' }, h('label', { for: id }, f.label), input);
}
function renderProfileForm() {
  const box = $('#profileForm'); box.innerHTML = '';
  for (const k of PROFILE_KEYS) { const f = FIELD_META[k]; if (f) box.append(profileField(f)); }
}
function openProfile() { profileDraft = { ...store.get('ba.profile', {}) }; renderProfileForm(); $('#dlgProfile').showModal(); }
function saveProfileDraft() {
  const p = {}; PROFILE_KEYS.forEach((k) => { if (profileDraft[k]) p[k] = profileDraft[k]; });
  store.set('ba.profile', p); toast('Informations enregistrées pour vos prochaines fiches.'); $('#dlgProfile').close();
}

function openFiche(id) { current = fiches[id]; persist(); enterFiche(); }

function listFiches() {
  const list = $('#ficheList'); list.innerHTML = '';
  const arr = Object.values(fiches).sort((a, b) => b.updated - a.updated);
  if (!arr.length) list.append(h('p', {}, 'Aucune fiche pour l’instant.'));
  for (const f of arr) {
    const d = f.data;
    const when = new Date(f.updated).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    list.append(h('div', { class: 'fiche-item' + (f.id === current.id ? ' current' : '') },
      h('b', {}, ficheName(d)),
      h('small', {}, `${TYPES[d.typeFiche] || 'Type non choisi'}, modifiée le ${when}`),
      h('div', { class: 'row-actions' },
        f.id === current.id ? null : h('button', { type: 'button', class: 'btn small primary', onclick: () => { openFiche(f.id); $('#dlgFiches').close(); } }, 'Ouvrir'),
        h('button', { type: 'button', class: 'btn small', onclick: (e) => generate(e.currentTarget, d) }, 'Voir le PDF'),
        h('button', { type: 'button', class: 'btn small', onclick: () => {
          const base = {}; KEEP_FOR_NEXT.forEach((k) => { if (d[k]) base[k] = d[k]; });
          if (d.verifDate) base.datePrecedente = d.verifDate;
          base.typeFiche = 'maint';
          const nf = newFiche(base); openFiche(nf.id); $('#dlgFiches').close(); toast('Nouvelle visite préparée avec les données de l’installation.');
        } }, 'Visite suivante'),
        h('button', { type: 'button', class: 'btn small danger', onclick: () => {
          if (!confirm('Supprimer définitivement cette fiche ?')) return;
          delete fiches[f.id];
          if (f.id === current.id) { const rest = Object.values(fiches).sort((a, b) => b.updated - a.updated); current = rest[0] || newFiche(); enterFiche(); }
          persist(); listFiches();
        } }, 'Supprimer'))));
  }
}

/* ---------- Génération et export du PDF ---------- */
let template = null, pdfFile = null, pdfUrl = null, pdfAdresse = '';
async function getTemplate() {
  if (!template) { const r = await fetch('BA.pdf'); if (!r.ok) throw new Error('Modèle PDF introuvable'); template = await r.arrayBuffer(); }
  return template;
}
const slug = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

async function generate(btn, data) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Génération…';
  try {
    const d = data || D();
    const bytes = await BAFill.fillBA(PDFLib, await getTemplate(), exportData(d));
    const typ = { mes: 'MiseEnService', maint: 'Maintenance', dep: 'Depannage' }[d.typeFiche] || 'Fiche';
    const name = ['BA', typ, slug(d.adressePose), (d.verifDate || today())].filter(Boolean).join('_') + '.pdf';
    pdfFile = new File([bytes], name, { type: 'application/pdf' });
    pdfAdresse = d.adressePose || '';
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    pdfUrl = URL.createObjectURL(pdfFile);
    $('#pdfName').textContent = name;
    const warn = [];
    if (!d.typeFiche) warn.push('Le type de fiche n’est pas coché.');
    if (!d.sigResp) warn.push('La signature du responsable du réseau intérieur manque : elle est indispensable.');
    if (!d.sigVerif) warn.push('La signature du vérificateur manque.');
    $('#pdfWarn').innerHTML = ''; warn.forEach((w) => $('#pdfWarn').append(h('div', { class: 'warn' }, w)));
    const canShare = navigator.canShare && navigator.canShare({ files: [pdfFile] });
    $('#btnShare').hidden = !canShare;
    $('#btnSave').classList.toggle('primary', !canShare);
    $('#dlgPdf').showModal();
  } catch (e) {
    console.error(e); toast('Échec de la génération : ' + e.message);
  } finally { btn.disabled = false; btn.textContent = label; }
}
async function share() {
  try {
    await navigator.share({ files: [pdfFile], title: pdfFile.name, text: 'Fiche disconnecteur BA : ' + pdfAdresse });
  } catch (e) { if (e.name !== 'AbortError') { toast('Partage impossible, enregistrement du fichier.'); download(); } }
}
function download() {
  const a = h('a', { href: pdfUrl, download: pdfFile.name }); document.body.append(a); a.click(); a.remove();
}

/* =====================================================================
   Démarrage
   ===================================================================== */
$('#btnShare').addEventListener('click', share);
$('#btnSave').addEventListener('click', download);
$('#btnOpen').addEventListener('click', () => window.open(pdfUrl, '_blank'));
$('#btnClosePdf').addEventListener('click', () => $('#dlgPdf').close());
$('#btnFiches').addEventListener('click', () => { listFiches(); $('#dlgFiches').showModal(); });
$('#btnCloseFiches').addEventListener('click', () => $('#dlgFiches').close());
$('#btnNew').addEventListener('click', () => { const f = newFiche(); openFiche(f.id); $('#dlgFiches').close(); });
$('#btnProfile').addEventListener('click', openProfile);
$('#btnSaveProfile').addEventListener('click', saveProfileDraft);
$('#btnCloseProfile').addEventListener('click', () => $('#dlgProfile').close());
document.querySelectorAll('dialog').forEach((dl) => dl.addEventListener('click', (e) => { if (e.target === dl) dl.close(); }));
$('#form').addEventListener('input', (e) => e.target.classList.remove('invalid'));

const syncOnline = () => document.body.classList.toggle('is-offline', !navigator.onLine);
addEventListener('online', syncOnline); addEventListener('offline', syncOnline); syncOnline();
let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => sigSetups.forEach((f) => f()), 200); });

const lastId = store.get('ba.current', null);
current = fiches[lastId] || Object.values(fiches).sort((a, b) => b.updated - a.updated)[0] || newFiche();
enterFiche();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker', e));
}
getTemplate().catch(() => {}); // met le modèle en mémoire dès l'ouverture
</script>
