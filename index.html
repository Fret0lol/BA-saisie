<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiche disconnecteur BA</title>
<meta name="theme-color" content="#0B3A60">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fiche BA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-display: swap; }

:root {
  /* Charte Dyskia (voir CHARTE-GRAPHIQUE.md) : marine, bleu et lagon du logo */
  --marine: #0B3A60;
  --bleu: #0B6AAE;
  --lagon: #66C2D4;
  --bg: #EEF3F7;        /* fond bleuté très clair */
  --paper: #FFFFFF;
  --ink: #0E2A42;       /* texte : marine assombri */
  --muted: #546B7F;
  --line: #CCD9E4;
  --primary: var(--bleu);  /* action principale */
  --primary-ink: #FFFFFF;
  --hex: var(--lagon);  /* repères de section */
  --hex-ink: var(--marine);
  --bar: var(--marine); /* barre du haut */
  --bar-ink: #FFFFFF;
  --bar-muted: #B7CCDD;
  --ok: #1E7A46; --ok-bg: #E3F2E8;
  --ko: #B3261E; --ko-bg: #FBE7E5;
  --field: #F4F7FA;
  /* Étiquettes de type de fiche */
  --t-mes: #0B4A5E; --t-mes-bg: #DDF2F6;
  --t-maint: #0B4F85; --t-maint-bg: #DCEAF6;
  --t-dep: #8A3B0B; --t-dep-bg: #FBE9DA;
  --t-none: #546B7F; --t-none-bg: #E6ECF1;
  --pen: #12338C;
  --radius: 10px;
  --tap: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #08131F; --paper: #0F2134; --ink: #E4EDF5; --muted: #93A9BC; --line: #23405C;
    --primary: #5AB0E6; --primary-ink: #04172A; --hex: var(--lagon); --hex-ink: #06202E;
    --bar: #0F2134; --bar-ink: #E4EDF5; --bar-muted: #93A9BC;
    --ok: #5CC98A; --ok-bg: #173526; --ko: #F2877E; --ko-bg: #3A1D1B; --field: #15293F;
    --t-mes: #8FD8E6; --t-mes-bg: #12384A; --t-maint: #9CCBF0; --t-maint-bg: #143454;
    --t-dep: #F4B98A; --t-dep-bg: #3D2615; --t-none: #93A9BC; --t-none-bg: #1B3047;
    --pen: #12338C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(118px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 "Atkinson", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px));
}
button, input, textarea { font: inherit; color: inherit; }
button svg { vertical-align: -5px; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lagon); outline-offset: 2px; }

/* ---------- Barre du haut ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--bar); color: var(--bar-ink);
  padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line);
}
.top-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px 6px; max-width: 760px; margin: 0 auto; }
.brand { width: 34px; height: 34px; flex: none; border-radius: 8px; background: #fff; }
.title { flex: 1; min-width: 0; }
.title h1 { font-size: 17px; margin: 0; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title .sub { font-size: 13px; color: var(--bar-muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.title .sub > * { flex: none; }
#ficheType { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
.saved { transition: opacity .3s; }
.offline { display: none; color: var(--hex-ink); background: var(--hex); border-radius: 4px; padding: 0 6px; font-weight: 700; font-size: 12px; }
body.is-offline .offline { display: inline; }

nav.chips { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr) minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 16px 10px; max-width: 760px; margin: 0 auto; }
nav.chips:empty { display: none; }
.chip { min-width: 0; max-width: 100%; justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; color: var(--ink); white-space: nowrap; cursor: pointer; }
.chip.word { padding: 0 12px; }
.chip.prev { padding-left: 8px; }
.chip.next { justify-self: end; padding: 0 8px 0 10px; }
.chip.current { justify-self: center; cursor: default; box-shadow: 0 0 0 2px var(--primary) inset; font-weight: 700; }
.chip .lbl { overflow: hidden; text-overflow: ellipsis; }
.chip .arrow { color: var(--muted); font-size: 18px; line-height: 1; }
.chip .hx { width: 26px; height: 24px; font-size: 13px; }
#stepCounter { color: var(--bar-muted); }

/* Hexagone de section : reprend le repère « BA » de la fiche papier */
.hx { display: inline-grid; place-items: center; background: var(--hex); color: var(--hex-ink); font-weight: 700;
  clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); flex: none; }

/* ---------- Contenu ---------- */
main { max-width: 760px; margin: 0 auto; padding: 16px 12px 24px; }
section.card { background: var(--paper); border-radius: var(--radius); padding: 18px 16px 20px; margin-bottom: 14px; border: 1px solid var(--line); }
section.card[hidden] { display: none; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.card-head .hx { width: 44px; height: 38px; font-size: 20px; }
.card-head .tag { font-size: 13px; font-weight: 700; color: var(--muted); border: 1.5px solid var(--muted); border-radius: 6px; padding: 2px 7px; }
.card-head h2 { font-size: 20px; line-height: 1.2; margin: 0; }
.card-intro { color: var(--muted); font-size: 14px; margin: 6px 0 4px; }

.field { margin-top: 16px; }
.field[hidden] { display: none; }
.field > label, .field > .lab { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.req { color: var(--ko); }
input.invalid, textarea.invalid { border-color: var(--ko); }
.seg.invalid { outline: 2px solid var(--ko); outline-offset: 3px; border-radius: 8px; }
.sig.invalid { border-color: var(--ko); border-style: solid; }
.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }

input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], input[inputmode], textarea {
  width: 100%; min-height: var(--tap); padding: 10px 12px; font-size: 17px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--field);
}
select { width: 100%; min-height: var(--tap); padding: 10px 12px; font-size: 17px; color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--field); }
select:focus { border-color: var(--primary); outline: none; }
input[type=date] { appearance: none; -webkit-appearance: none; display: block; }
textarea { min-height: 110px; resize: vertical; }
input:focus, textarea:focus { border-color: var(--primary); outline: none; background: var(--paper); }
.prefix { display: flex; align-items: stretch; }
.prefix > span { white-space: nowrap; display: flex; align-items: center; padding: 0 10px; border: 1.5px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; color: var(--muted); font-weight: 700; background: var(--bg); }
.prefix > span .req { color: var(--ko); }
.prefix input { border-radius: 0 8px 8px 0; }

/* Choix segmentés */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { flex: 1 1 auto; min-height: var(--tap); padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); font-size: 16px; }
.seg button[aria-checked=true] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
.seg.stack { flex-direction: column; }
.seg.stack button { text-align: left; display: flex; gap: 10px; align-items: center; }
.seg.stack button::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; flex: none; opacity: .6; }
.seg.stack button[aria-checked=true]::before { background: currentColor; box-shadow: inset 0 0 0 3px var(--paper); opacity: 1; }
.seg.stack button.good[aria-checked=true] { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.seg.stack button.bad[aria-checked=true] { background: var(--ko-bg); border-color: var(--ko); color: var(--ko); }

.check { display: flex; gap: 12px; align-items: center; min-height: var(--tap); padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 8px; margin-top: 8px; }
.check input { width: 24px; height: 24px; accent-color: var(--primary); flex: none; }
.check:has(input:checked) { border-color: var(--primary); }
.check:has(input.invalid) { border-color: var(--ko); }

.btn { min-height: var(--tap); padding: 0 18px; border-radius: 8px; border: 1.5px solid var(--primary); background: var(--paper); color: var(--primary); font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.danger { border-color: var(--ko); color: var(--ko); }
.btn.small { min-height: 38px; font-size: 14px; padding: 0 12px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* Essais */
.essai { border-top: 1px solid var(--line); padding: 18px 0 4px; }
.essai:first-of-type { border-top: 0; }
.essai-head { display: flex; gap: 12px; align-items: flex-start; }
.essai-n { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-weight: 700; flex: none; }
.essai-g { font-weight: 700; font-size: 17px; }
.essai-m { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.press { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.press .prefix > span { min-width: 58px; }
.timer { margin-top: 10px; }
.timer.run { background: var(--hex); border-color: var(--hex); color: var(--hex-ink); }
.essai details { margin-top: 12px; }
.essai summary { cursor: pointer; color: var(--primary); font-weight: 700; min-height: 40px; display: flex; align-items: center; }
.alert { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--ko); background: var(--ko-bg); border-radius: 0 8px 8px 0; font-size: 15px; }
.alert[hidden] { display: none; }
.note-star { font-size: 14px; color: var(--muted); margin-top: 6px; }

/* Pièces */
.piece { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.piece .full { grid-column: 1 / -1; }
.piece[hidden] { display: none; }

/* Signature */
.sig { position: relative; border: 1.5px dashed var(--muted); border-radius: 8px; background: #fff; height: 170px; touch-action: none; }
.sig canvas { width: 100%; height: 100%; display: block; border-radius: 8px; }
.sig .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #8A979C; pointer-events: none; font-size: 15px; }
.sig.has .ph { display: none; }
.sig-actions { display: flex; justify-content: flex-end; margin-top: 6px; }

/* Barre d'action + barre d'onglets, empilées en bas d'écran */
.bottom-stack { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; }
.bottom { background: var(--paper); border-top: 1px solid var(--line); padding: 10px 16px; }
.bottom[hidden] { display: none; }
.bottom-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.bottom .btn.primary { flex: 1; font-size: 17px; min-height: 52px; }

.tabbar { display: flex; background: var(--paper); border-top: 1px solid var(--line);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); }
.bottom + .tabbar { border-top: 1px solid var(--line); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 52px; padding: 6px 4px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 11px; font-weight: 700; }
.tab svg { width: 22px; height: 22px; }
.tab.active { color: var(--primary); }

/* Icônes d'action (listes de fiches) */
.icon-actions { display: flex; gap: 8px; }
.icon-action { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); }
.icon-action svg { width: 20px; height: 20px; }
.icon-action.primary { border-color: var(--primary); color: var(--primary); }
.icon-action.danger { border-color: var(--ko); color: var(--ko); }

/* Feuilles modales */
dialog { overflow: auto; border: 0; padding: 0; width: min(560px, 100%); max-height: 88vh; margin: auto auto 0; border-radius: 16px 16px 0 0; background: var(--paper); color: var(--ink); }
@media (min-width: 600px) { dialog { margin: auto; border-radius: 16px; } }
dialog::backdrop { background: rgba(6, 22, 38, .6); }
.sheet { padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 0 0 4px; font-size: 20px; }
.sheet p { margin: 6px 0; color: var(--muted); }
.sheet .stack { display: grid; gap: 10px; margin-top: 16px; }
.sheet .btn { width: 100%; }
.warn { color: var(--ko); background: var(--ko-bg); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 15px; }
.fname { font-weight: 700; color: var(--ink) !important; word-break: break-all; }
.fiche-item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
.fiche-item b { display: block; }
.fiche-item small { color: var(--muted); }
/* Mes fiches */
.fab { position: fixed; z-index: 25; right: max(16px, calc((100vw - 760px) / 2 + 16px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 16px;
  background: var(--primary); color: var(--primary-ink); font-size: 17px; font-weight: 700; box-shadow: 0 6px 18px rgba(6, 22, 38, .28); }
.fab svg { width: 22px; height: 22px; }
.fab:active { transform: scale(.97); }
.fsearch { position: relative; }
.fsearch svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.fsearch input { width: 100%; min-height: var(--tap); padding: 10px 12px 10px 42px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); }
.fsearch input:focus { border-color: var(--primary); outline: none; }
.fgroup { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 4px 8px; }
.fcard { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.fcard.current { border-color: var(--primary); box-shadow: inset 4px 0 0 var(--primary); }
.fcard-main { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 16px 10px; border: 0; background: none; color: inherit; text-align: left; }
.fcard-main:active { background: var(--field); }
.fcard-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 16px 14px; }
.fcard-actions .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.fcard-actions .btn svg { width: 18px; height: 18px; }
.fcard-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ftype { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--t-none-bg); color: var(--t-none); }
.ftype.mes { background: var(--t-mes-bg); color: var(--t-mes); }
.ftype.maint { background: var(--t-maint-bg); color: var(--t-maint); }
.ftype.dep { background: var(--t-dep-bg); color: var(--t-dep); }
.fcur { font-size: 12px; font-weight: 700; color: var(--primary); }
.fcard-title { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.fcard-sub { font-size: 14px; color: var(--muted); }
.fprog { width: 100%; height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
.fprog i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
.fcard-step { font-size: 13px; font-weight: 700; color: var(--ink); }
.fcard-when { font-size: 13px; color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty img { width: 72px; height: 72px; border-radius: 16px; background: #fff; margin-bottom: 12px; }
.empty b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.empty-search { color: var(--muted); text-align: center; margin-top: 24px; }
.btn.danger { border-color: var(--ko); color: var(--ko); }
.sheet .btn svg { margin-right: 4px; }
.osheet { padding-top: 8px; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.osheet-head { display: flex; gap: 12px; align-items: flex-start; }
.osheet-head > div { flex: 1; min-width: 0; }
.osheet-head h3 { overflow-wrap: anywhere; }
.osheet-head p { margin: 2px 0 0; font-size: 14px; }
.osheet-head .icon-action { width: 40px; height: 40px; border: 0; background: var(--field); border-radius: 50%; flex: none; }
.osec { margin-top: 18px; }
.osec h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.osec-body { display: grid; gap: 10px; }
.osec-body p { margin: 0; }
.osec-body .warn { margin-top: 0; }
.ofile { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.onote { font-size: 14px; color: var(--ink) !important; background: var(--field); border-radius: 8px; padding: 10px 12px; }
.osec-body .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.osec-body .sheet-row:has(> :only-child) { grid-template-columns: 1fr; }
.pdf-wait { color: var(--muted); text-align: center; padding: 14px 0; }
.back-link { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 0; margin: -4px 0 8px; border: 0; background: none; color: var(--primary); font-size: 16px; font-weight: 700; }
.slist { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.srow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; border: 0; background: none; color: var(--ink); text-align: left; }
.srow + .srow { border-top: 1px solid var(--line); }
.srow:active { background: var(--field); }
.srow-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--t-maint-bg); color: var(--t-maint); flex: none; }
.srow-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srow-txt b { font-size: 16px; }
.srow-txt small { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow > svg:last-child { color: var(--muted); flex: none; }
.orow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font-size: 16px; font-weight: 700; text-align: left; }
.orow:last-child { border-bottom: 1px solid var(--line); }
.orow svg { color: var(--muted); }
.orow.danger, .orow.danger svg { color: var(--ko); }
.sheet-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.device-item { display: flex; align-items: center; gap: 8px; }
.device-item > div { flex: 1; min-width: 0; }
.device-item .icon-action { flex: none; }
.toast { position: fixed; left: 50%; bottom: calc(132px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-size: 15px; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <img class="brand" src="icons/logo.png" alt="Dyskia">
    <div class="title">
      <h1 id="ficheTitle">Nouvelle fiche</h1>
      <div class="sub"><span id="ficheType">Type à choisir</span><span id="stepCounter"></span><span class="offline">Hors ligne</span><span class="saved" id="saved"></span></div>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Étapes"></nav>
</header>

<main id="form"></main>

<div class="bottom-stack">
  <div class="bottom" id="wizardBar"><div class="bottom-in" id="bottomBar"></div></div>
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav>

// Essais du verso. p = pressions relevées [suffixe de clé, libellé] ; opts = résultats (le premier est le cas conforme)
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : null; };
const ESSAIS = [
  { n: 1, g: 'Début de contrôle V1 V2', m: 'Ouvrir 10, 9, 8, 7, 6, 5, 4, 3 puis V1. Refermer 9, 10, 6 puis V1.',

    opts: [['ok', 'Pas de fuite en D'], ['v1', 'Fuite permanente en D : réparer V1'], ['v2', 'Fuite permanente en D : réparer V2'], ['v1v2', 'Fuite permanente en D : réparer V1 et V2']],
    notes: [['repV1', 'Réparation V1', (o) => o === 'v1' || o === 'v1v2'], ['repV2', 'Réparation V2', (o) => o === 'v2' || o === 'v1v2']] },
  { n: 2, g: 'Vanne amont V1', m: 'Ouvrir 6.', p: [],
    opts: [['ok', 'Pas d’écoulement en 6'], ['hs', 'Écoulement continu en 6 : vanne 1 HS']] },

    auto: (d) => { const v = num(d.e3_M1); return v == null ? null : v === 0 ? 'ok' : 'hs'; } },

// Index clé -> définition de champ (label, type…), pour le récapitulatif
const FIELD_META = {};
(function indexFields(fields) {
  for (const f of fields) {
    if (f.t === 'row') { indexFields(f.fields); continue; }
    if (f.k) FIELD_META[f.k] = f;
  }
})(SECTIONS.flatMap((s) => s.fields));

const PROFILE_KEYS = ['verificateur', 'competences', 'certificat', 'certifExpiration', 'entreprise', 'entrepriseTel', 'entrepriseAdresse', 'entrepriseMail',
  'verifNom', 'sigVerif'];
const DEVICE_KEYS = ['appMarque', 'appType', 'appSerie', 'appDate', 'appLogoNF'];

/* =====================================================================
   Stockage local (hors ligne)
   ===================================================================== */
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('Mémoire du téléphone pleine : supprimez d’anciennes fiches.'); return false; } },
};
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let fiches = store.get('ba.fiches', {});
let current = null; // { id, created, updated, data }

/* Appareils de contrôle enregistrés : [{ id, used, appMarque, appType, appSerie, appDate, appLogoNF }] */
let devices = store.get('ba.devices', null);
if (!devices) {
  // Ancienne version : un seul appareil rangé dans le profil
  const profile = store.get('ba.profile', {}), dev = { id: uid(), used: Date.now() };
  DEVICE_KEYS.forEach((k) => { if (profile[k]) dev[k] = profile[k]; delete profile[k]; });
  devices = dev.appMarque || dev.appType || dev.appSerie ? [dev] : [];
  store.set('ba.devices', devices); store.set('ba.profile', profile);
}
const deviceName = (v) => [v.appMarque, v.appType].filter(Boolean).join(' ') + (v.appSerie ? ` — n° ${v.appSerie}` : '') || 'Appareil sans nom';
const sameDevice = (a, b) => a.appSerie || b.appSerie ? a.appSerie === b.appSerie : a.appMarque === b.appMarque && a.appType === b.appType;
const lastDevice = () => devices.slice().sort((a, b) => b.used - a.used)[0];
function deviceFields(v = {}) { const o = {}; DEVICE_KEYS.forEach((k) => { if (v[k]) o[k] = v[k]; }); return o; }

function newFiche(base = {}) {
  const profile = store.get('ba.profile', {});
  const f = { id: uid(), created: Date.now(), updated: Date.now(), data: { ...profile, ...deviceFields(lastDevice()), verifDate: today(), respDate: today(), ...base } };
  fiches[f.id] = f; persist(); return f;
}
function persist() { store.set('ba.fiches', fiches); if (current) store.set('ba.current', current.id); }
let saveTimer;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    current.updated = Date.now(); fiches[current.id] = current; persist();
    if (activeTab !== 'fiche') return;
    const el = document.getElementById('saved'); el.textContent = 'Enregistré'; el.style.opacity = 1;
    setTimeout(() => (el.style.opacity = 0), 1500);
  }, 350);
}

/* =====================================================================
   Rendu du formulaire
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (k === 'class') el.className = v; else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
// Icônes SVG dessinées à la main (traits, sans dépendance externe)
const SVGNS = 'http://www.w3.org/2000/svg';
const svg = (tag, attrs = {}, ...kids) => {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid) el.append(kid);
  return el;
};
const ICONS = {
  doc: () => svg('path', { d: 'M6 3h8l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z M14 3v5h5 M9 13h6 M9 17h6' }),
  list: () => svg('g', {}, svg('path', { d: 'M4 6h16 M4 12h16 M4 18h10' })),
  gear: () => svg('g', {},
    svg('line', { x1: 4, y1: 6, x2: 20, y2: 6 }), svg('circle', { cx: 15, cy: 6, r: 2, fill: 'var(--paper)' }),
    svg('line', { x1: 4, y1: 12, x2: 20, y2: 12 }), svg('circle', { cx: 9, cy: 12, r: 2, fill: 'var(--paper)' }),
    svg('line', { x1: 4, y1: 18, x2: 20, y2: 18 }), svg('circle', { cx: 17, cy: 18, r: 2, fill: 'var(--paper)' })),
  plus: () => svg('path', { d: 'M12 5v14 M5 12h14' }),

function trimCanvas(c) {

function startTimer(btn) {
  if (timer) { clearInterval(timer.iv); timer.btn.classList.remove('run'); timer.btn.textContent = 'Minuteur 3 min'; if (timer.btn === btn) { timer = null; return; } }
  let left = 180; btn.classList.add('run');
  const tick = () => { btn.textContent = `Relever dans ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')} (toucher pour arrêter)`; };
  tick();
  timer = { btn, iv: setInterval(() => {
    left--; tick();
    if (left <= 0) {
      clearInterval(timer.iv); timer = null; btn.classList.remove('run'); btn.textContent = 'Relever la pression maintenant';
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}

}

/* ---------- Parcours pas-à-pas ----------
   Un « step » est soit une section normale, soit un essai isolé (§ Essais).
   On ne peut avancer que dans l'ordre ; une étape déjà franchie (Suivant
   cliqué) reste accessible en arrière. */

function computeSteps(d = D()) {
  const out = [];
  for (const s of SECTIONS) {
    if (!sectionVisible(s.id, d)) continue;
    if (s.id === 'essais') { for (const e of ESSAIS) out.push({ id: `essai-${e.n}`, parent: 'essais', section: s, essai: e }); }
    else out.push({ id: s.id, section: s });
  }
  return out;
}
function stepUnlocked(idx) {
  if (idx <= 0) return true;
  const prevId = steps[idx - 1].id;
  return !!(D()._visited && D()._visited[prevId]);
}
function enterFiche() {
  activeTab = 'fiche';
  steps = computeSteps();
  const idx = steps.findIndex((s) => s.id === D()._step);
  stepIndex = idx === -1 ? 0 : idx;
  renderPage();
}
// Champs obligatoires : bloquent le passage à l'étape suivante (pas de saisie forcée en arrière)
function collectRequiredFields(fields) {
  let out = [];
  for (const f of fields) {
    if (f.t === 'row') { out = out.concat(collectRequiredFields(f.fields)); continue; }
    if (f.required && f.k) out.push(f);
  }
  return out;
}
// Essai : pressions relevées obligatoires ; si le résultat n'est pas conforme (≠ 1re option),
// la réparation et les pressions après réparation deviennent obligatoires avant de continuer.
function essaiMissingFields(step) {
  const e = step.essai, d = D(), missing = [];
  for (const [sfx, lab] of e.p) {
    const k = `e${e.n}_${sfx}`;
    if (d[k] == null || d[k] === '') missing.push({ label: lab, k });
  }
  if (e.opts) {
    const val = d[`e${e.n}`];
    if (val == null || val === '') missing.push({ label: 'Résultat', k: `e${e.n}` });
    else if (val !== e.opts[0][0]) {
      for (const [sfx, lab] of e.p) {
        const k = `r${e.n}_${sfx}`;
        if (d[k] == null || d[k] === '') missing.push({ label: `${lab} après réparation`, k });
      }
      for (const [k, lab, cond] of e.notes || []) {
        if (cond(val) && (d[k] == null || d[k] === '')) missing.push({ label: lab, k });
      }
    }
  }
  return missing;
}
function stepMissingFields(step) {
  if (step.parent === 'essais') return essaiMissingFields(step);
  if (!step.section) return [];
  const d = D();
  const missing = collectRequiredFields(step.section.fields).filter((f) => {
    if (f.when && !f.when(d)) return false;
    const v = d[f.k];
    return v == null || v === '';
  });
  const oneOf = step.section.oneOf;
  if (oneOf && (!oneOf.when || oneOf.when(d)) && !oneOf.keys.some((k) => d[k])) missing.push({ label: oneOf.label, keys: oneOf.keys });
  return missing;
}
function markMissing(fields) {
  const main = $('#form');
  let first = null;
  for (const f of fields) {
    for (const k of f.keys || [f.k]) {
      const el = main.querySelector(`[name="${k}"]`) || main.querySelector(`.seg[data-k="${k}"]`) || main.querySelector(`.sig[data-k="${k}"]`);
      if (el) { el.classList.add('invalid'); if (!first) first = el; }
    }
  }
  if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (first.focus) first.focus(); }
}
// Étape déjà entièrement préremplie (ex. profil vérificateur) : on la saute en avançant
function autoSkipForward() {
  while (stepIndex < steps.length - 1) {
    const step = steps[stepIndex];
    if (!step.section || !step.section.autoSkip || stepMissingFields(step).length) break;
    (D()._visited || (D()._visited = {}))[step.id] = true;
    stepIndex++;
  }
}
function goNext() {
  const step = steps[stepIndex];
  if (!step) return;
  const missing = stepMissingFields(step);
  if (missing.length) { markMissing(missing); toast('À compléter : ' + missing.map((f) => f.label).join(', ')); return; }
  const visited = D()._visited || (D()._visited = {});
  visited[step.id] = true;
  if (stepIndex < steps.length - 1) stepIndex++;
  autoSkipForward();
  scheduleSave();
  renderStep();
}
function goPrev() {
  if (stepIndex > 0) stepIndex--;
  renderStep();
}

function keysOf(s, onlyVisible = false, d = D()) {
  const out = [];
  const walk = (f) => {
    if (onlyVisible && f.when && !f.when(d)) return;
    if (f.t === 'row') return f.fields.forEach(walk);
    if (f.k) out.push(f.k);
    if (f.t === 'essais') for (const e of ESSAIS) {
      e.p.forEach(([sfx]) => out.push(`e${e.n}_${sfx}`, `r${e.n}_${sfx}`));
      if (e.opts) out.push(`e${e.n}`);
      (e.notes || []).forEach(([k, , cond]) => { if (!onlyVisible || cond(d[`e${e.n}`])) out.push(k); });
      if (e.final) out.push('v1Final', 'v2Final');
    }
    if (f.t === 'pieces') for (let i = 1; i <= 5; i++) out.push(`piece${i}`, `piece${i}_n`, `piece${i}_obs`);
  };
  s.fields.forEach(walk);
  return out;
}

  const out = {};
  for (const s of SECTIONS) {
    if (!sectionVisible(s.id, d)) continue;
    for (const k of keysOf(s, true, d)) if (d[k] != null && d[k] !== '') out[k] = d[k];
  }
  return out;
}

function relTime(t) {
  const now = new Date(), d = new Date(t), min = Math.round((now - d) / 60000);
  const hm = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const day0 = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((day0(now) - day0(d)) / 864e5);
  if (min < 1) return 'à l’instant';
  if (min < 60) return `il y a ${min} min`;
  if (days === 0) return `aujourd’hui à ${hm}`;
  if (days === 1) return `hier à ${hm}`;
  return 'le ' + d.toLocaleDateString('fr-FR');
}

  const main = $('#form'); main.innerHTML = '';
  const arr = Object.values(fiches).sort((a, b) => b.updated - a.updated);
  $('#ficheType').textContent = arr.length ? `${arr.length} fiche${arr.length > 1 ? 's' : ''}` : '';
  // Bouton flottant en bas à droite, à portée de pouce
  main.append(h('button', { type: 'button', class: 'fab', onclick: () => { const f = newFiche(); openFiche(f.id); } }, icon('plus'), h('span', {}, 'Nouvelle fiche')));
  if (!arr.length) {
    main.append(h('div', { class: 'empty' },
      h('img', { src: 'icons/logo.png', alt: '' }),
      h('b', {}, 'Aucune fiche pour l’instant'),
      h('p', {}, 'Touchez « Nouvelle fiche », en bas à droite, pour commencer une saisie. Elle sera enregistrée sur ce téléphone, même hors ligne.')));
    return;
  }
  const list = h('div', { class: 'fiche-list' });
  const draw = () => {
    const q = ficheQuery.trim().toLowerCase();
    const shown = q ? arr.filter((f) => [ficheDisplayName(f), f.data.adressePose, f.data.proprio, TYPES[f.data.typeFiche]].filter(Boolean).join(' ').toLowerCase().includes(q)) : arr;
    list.innerHTML = '';
    if (!shown.length) { list.append(h('p', { class: 'empty-search' }, 'Aucune fiche ne correspond à « ' + ficheQuery.trim() + ' ».')); return; }
    let group = null;
    for (const f of shown) {
      const g = ficheGroup(f.updated);
      if (g !== group) { list.append(h('h2', { class: 'fgroup' }, g)); group = g; }
      list.append(ficheCard(f));
    }
  };
  if (arr.length > 3) {
    main.append(h('div', { class: 'fsearch' }, icon('search'),
      h('input', { type: 'search', placeholder: 'Rechercher une adresse, un propriétaire…', 'aria-label': 'Rechercher une fiche', value: ficheQuery, autocomplete: 'off',
        oninput: (e) => { ficheQuery = e.target.value; draw(); } })));
  }
  main.append(list);
  draw();
}

/* ---------- Génération et export du PDF ---------- */
let template = null, pdfFile = null, pdfUrl = null, pdfAdresse = '';
async function getTemplate() {
  if (!template) { const r = await fetch('BA.pdf'); if (!r.ok) throw new Error('Modèle PDF introuvable'); template = await r.arrayBuffer(); }
  return template;
}
const slug = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);

// Génère le PDF d'une fiche et le garde prêt pour Partager / Télécharger / Ouvrir
async function buildPdf(d) {
  const bytes = await BAFill.fillBA(PDFLib, await getTemplate(), exportData(d));
  const typ = { mes: 'MiseEnService', maint: 'Maintenance', dep: 'Depannage' }[d.typeFiche] || 'Fiche';
  const name = ['BA', typ, slug(d.adressePose), (d.verifDate || today())].filter(Boolean).join('_') + '.pdf';
  pdfFile = new File([bytes], name, { type: 'application/pdf' });
  pdfAdresse = d.adressePose || '';
  if (pdfUrl) URL.revokeObjectURL(pdfUrl);
  pdfUrl = URL.createObjectURL(pdfFile);
  const warn = [];
  if (!d.typeFiche) warn.push('Le type de fiche n’est pas coché.');
  if (!d.sigResp) warn.push('La signature du responsable du réseau intérieur manque : elle est indispensable.');
  if (!d.sigVerif) warn.push('La signature du vérificateur manque.');
  return { name, warn, canShare: !!(navigator.canShare && navigator.canShare({ files: [pdfFile] })) };
}
async function generate(btn) {
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Génération…';
  try {
    const { name, warn, canShare } = await buildPdf(D());
    $('#pdfName').textContent = name;
    $('#pdfWarn').replaceChildren(...warn.map((w) => h('div', { class: 'warn' }, w)));
    $('#btnShare').hidden = !canShare;
    $('#dlgPdf').showModal();
  } catch (e) {
    console.error(e); toast('Échec de la génération : ' + e.message);
  } finally { btn.disabled = false; btn.textContent = label; }
}
async function share() {
  try {
    await navigator.share({ files: [pdfFile], title: pdfFile.name, text: 'Fiche disconnecteur BA : ' + pdfAdresse });
  } catch (e) { if (e.name !== 'AbortError') { toast('Partage impossible, téléchargement du fichier.'); download(); } }
}
function download() {
  const a = h('a', { href: pdfUrl, download: pdfFile.name }); document.body.append(a); a.click(); a.remove();
}

/* =====================================================================
   Démarrage
   ===================================================================== */
$('#btnShare').addEventListener('click', share);
$('#btnSave').addEventListener('click', download);
$('#btnOpen').addEventListener('click', () => window.open(pdfUrl, '_blank'));
$('#btnClosePdf').addEventListener('click', () => $('#dlgPdf').close());
$('#btnCloseFiche').append(icon('close'));
$('#btnCloseFiche').addEventListener('click', () => $('#dlgFiche').close());
$('#btnSaveQuit').addEventListener('click', async () => {
  $('#dlgPdf').close();
  const name = await askFicheName(current, 'Enregistrer et quitter');
  if (name == null) return; // annulé : on reste sur la saisie
  applyFicheName(current, name);
  clearTimeout(saveTimer); current.updated = Date.now(); fiches[current.id] = current; persist();
  switchTab('fiches'); toast('Fiche enregistrée.');
});
document.querySelectorAll('dialog').forEach((dl) => dl.addEventListener('click', (e) => { if (e.target === dl) dl.close(); }));
$('#form').addEventListener('input', (e) => e.target.classList.remove('invalid'));

const syncOnline = () => document.body.classList.toggle('is-offline', !navigator.onLine);
addEventListener('online', syncOnline); addEventListener('offline', syncOnline); syncOnline();
let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => sigSetups.forEach((f) => f()), 200); });

const lastId = store.get('ba.current', null);
current = fiches[lastId] || Object.values(fiches).sort((a, b) => b.updated - a.updated)[0] || newFiche();
enterFiche();

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('Service worker', e));
}
getTemplate().catch(() => {}); // met le modèle en mémoire dès l'ouverture
</script>
